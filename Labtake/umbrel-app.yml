manifestVersion: 1.0.0
id: Labtake
icon: https://raw.githubusercontent.com/rotowaxer/ducktake/main/duck-labtake/icon.svg
name: LabTake
tagline: Try a lab stock and expiry tracker with sample data
category: developer
version: "1"
port: 18096
description: >-
  A demonstration copy of a laboratory inventory app: reagent and consumable stock,
  lots, expiry dates, pre-acceptance, stocktakes and ordering, running on PocketBase.


  It comes with sample data — real products with made-up stock, lots and dates — and
  three shared sign-ins (Admin, Reviewer and Bench staff) offered on its sign-in screen.
  Everything visitors change is put back every night at 3 a.m., with the dates moved on
  to the new day, so the demo never goes stale. It sends no email.
developer: Rotowaxer
website: https://pocketbase.io/
submitter: Rotowaxer
support: https://github.com/pocketbase/pocketbase/discussions
