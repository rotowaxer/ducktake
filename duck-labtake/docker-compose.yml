# LabTake demo: the gate, which runs up to 50 copies of the demo.
# Made by tools/demo/make_compose.js (v172): change that and run it, not this.
#
# The Umbrel proxy talks to the gate (the app service); the gate gives each visitor a copy
# of their own, resets it for them, and takes it back after 30 minutes
# without use. Once none is free, a copy in use takes up to 5 people
# (LABTAKE_SHARE). Every copy has its own data folder (data/slots/<n>) and
# shares the demo's public, hooks and migrations folders. See
# docs/labtake-demo.md and gate/gate.js.
#
# v178: the gate runs the copies itself, as its own processes: a copy is
# started when somebody needs it and stopped once it has been taken back,
# so the demo holds next to no memory while nobody uses it. The gate has no
# say over Docker. The pocketbase service only hands it PocketBase: it
# copies the program into data/bin (beside the old one, then over it, as a
# running copy keeps the old one open) and sleeps.
#
# The limits are on the app service, so the demo cannot starve the other
# apps on the Umbrel (Plex, Jellyfin, Home Assistant):
#   mem_limit 6g        50 copies in use and the gate: a copy in use was about
#                       100 MB, and 80 MB after ten days (v176). Past it, the
#                       kernel stops a copy, which the gate starts again at
#                       its visitor's next request.
#   GOMEMLIMIT 200MiB   each copy's Go garbage collector works harder near
#                       this, so its own memory stays below it.
#   cpu_shares 1287     a CPU weight of 50, what the 50 copies weighed
#                       together before v178 (weight 1 each). The Umbrel
#                       runs cgroup v2, where Docker makes the shares a
#                       cpu.weight of 1 + (shares - 2) * 9999 / 262142,
#                       rounded down. Other apps keep the default weight
#                       100, so they come first when the CPU is busy, and
#                       the demo still gets any CPU that is left over.
#                       Inside, every copy runs under nice 10, so the gate
#                       comes before them. To check (cgroup version 2, then
#                       a weight of 50):
#                         docker info | grep -i cgroup
#                         docker exec duck-labtake_app_1 cat /sys/fs/cgroup/cpu.weight
#   pids_limit 4096     about 80 threads a copy: a runaway copy cannot use
#                       up the server's processes.
#   oom_score_adj 500   if the server runs out of memory, the kernel stops a
#                       copy before another app.
# Each copy keeps 2 ready script engines (--hooksPool=2, in gate.js), not
# PocketBase's 15: each holds its own copy of every hook library it has
# used, which is most of a copy's memory. Each copy also restarts itself
# once a day, after the nightly load (labtake_demo.pb.js).
services:

  app_proxy:
    environment:
      APP_HOST: duck-labtake_app_1
      APP_PORT: 8090
      PROXY_AUTH_ADD: "false"

  # v178: PocketBase for the gate's copies, and nothing else. It keeps
  # running so Umbrel sees the app as up.
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.39.6
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "cp /usr/local/bin/pocketbase /pb/pocketbase.new && mv -f /pb/pocketbase.new /pb/pocketbase || exit 1; trap 'exit 0' TERM; sleep 2147483647 & wait"]
    volumes:
      - ${APP_DATA_DIR}/data/bin:/pb

  # The gate (gate/gate.js), and the copies it runs. Named app, as Umbrel
  # expects the service the proxy talks to to be.
  app:
    image: node:22-alpine
    restart: unless-stopped
    mem_limit: 6g
    cpu_shares: 1287
    pids_limit: 4096
    oom_score_adj: 500
    command: ["node", "/gate/gate.js"]
    environment:
      PORT: "8090"
      LABTAKE_SLOTS: "50"
      LABTAKE_SHARE: "5"
      LABTAKE_IDLE_MIN: "30"
      LABTAKE_SLOT_KEY: ${APP_SEED}
      LABTAKE_STATE: /state/slots.json
      GOMEMLIMIT: 200MiB
    volumes:
      - ${APP_DATA_DIR}/data/gate:/gate:ro
      - ${APP_DATA_DIR}/data/gate-state:/state
      - ${APP_DATA_DIR}/data/bin:/pb:ro
      - ${APP_DATA_DIR}/data/slots:/data/slots
      - ${APP_DATA_DIR}/data/public:/data/public
      - ${APP_DATA_DIR}/data/hooks:/data/hooks
      - ${APP_DATA_DIR}/data/migrations:/data/migrations
    depends_on:
      - pocketbase
