# LabTake demo: the gate and 50 copies of the demo.
# Made by tools/demo/make_compose.js (v172): change that and run it, not this.
#
# The Umbrel proxy talks to the gate (the app service); the gate gives each visitor a copy
# of their own (slot1 ... slot50), resets it for them, and takes it back
# after 30 minutes without use. Once none is free, a copy in use takes up
# to 5 people (LABTAKE_SHARE). Every copy has its own data folder and
# shares the demo's public, hooks and migrations folders. See
# docs/labtake-demo.md and gate/gate.js.
services:

  app_proxy:
    environment:
      APP_HOST: duck-labtake_app_1
      APP_PORT: 8090
      PROXY_AUTH_ADD: "false"

  # The gate (gate/gate.js). Named app, as Umbrel expects the service the
  # proxy talks to to be.
  app:
    image: node:22-alpine
    restart: unless-stopped
    command: ["node", "/gate/gate.js"]
    environment:
      PORT: "8090"
      LABTAKE_SLOTS: "50"
      LABTAKE_SHARE: "5"
      LABTAKE_SLOT_HOST: "http://duck-labtake_slot{n}_1:8090"
      LABTAKE_IDLE_MIN: "30"
      LABTAKE_SLOT_KEY: ${APP_SEED}
      LABTAKE_STATE: /state/slots.json
    volumes:
      - ${APP_DATA_DIR}/data/gate:/gate:ro
      - ${APP_DATA_DIR}/data/gate-state:/state
    depends_on:
      - slot1
      - slot2
      - slot3
      - slot4
      - slot5
      - slot6
      - slot7
      - slot8
      - slot9
      - slot10
      - slot11
      - slot12
      - slot13
      - slot14
      - slot15
      - slot16
      - slot17
      - slot18
      - slot19
      - slot20
      - slot21
      - slot22
      - slot23
      - slot24
      - slot25
      - slot26
      - slot27
      - slot28
      - slot29
      - slot30
      - slot31
      - slot32
      - slot33
      - slot34
      - slot35
      - slot36
      - slot37
      - slot38
      - slot39
      - slot40
      - slot41
      - slot42
      - slot43
      - slot44
      - slot45
      - slot46
      - slot47
      - slot48
      - slot49
      - slot50

  slot1:
    image: ghcr.io/muchobien/pocketbase:0.39.6
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      LABTAKE_SLOT_KEY: ${APP_SEED}
    volumes:
      - ${APP_DATA_DIR}/data/slots/1:/pb_data
      - ${APP_DATA_DIR}/data/public:/pb_public
      - ${APP_DATA_DIR}/data/hooks:/pb_hooks
      - ${APP_DATA_DIR}/data/migrations:/pb_migrations

